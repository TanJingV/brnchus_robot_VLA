   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #17365d" x="61.905882" y="300.58848" transform="rotate(-0 61.905882 300.58848)">耦合含义：近端弯曲会改变远端三根绳的总几何长度与力矩臂；它不是两套完全独立的执行器。</text>
